<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">

  <defs>
    <!-- Outer ring gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#383C48"/>
    </linearGradient>

    <!-- Inner background gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#222530"/>
    </radialGradient>

    <!-- User gradient -->
    <linearGradient id="userGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d1d5db"/>
    </linearGradient>
  </defs>

  <!-- Outer ring -->
  <circle cx="256" cy="256" r="250" fill="url(#ringGrad)" />

  <!-- Inner circle -->
  <circle cx="256" cy="256" r="220" fill="url(#bgGrad)" />

  <!-- Head -->
  <circle cx="256" cy="210" r="70" fill="#898C96" />

  <!-- Shoulders -->
  <path
    d="M120 380
       C150 320 210 290 256 290
       C302 290 362 320 392 380
       Q256 440 120 380 Z"
    fill="#898C96"
  />

</svg>